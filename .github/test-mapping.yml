# Test Mapping Configuration
# Maps source files to their corresponding test files
# Used by CI to ensure test collateral is updated when source code changes

# Format:
# mappings:
#   - source: "path/to/source/**/*.py"  # Glob pattern for source files
#     tests: "path/to/tests/test_*.py"   # Corresponding test file(s)
#     manual_test_required: false        # Optional: if true, warns but doesn't fail
#     notes: "Optional notes"             # Optional: additional context

mappings:
  # Tools - Python utilities
  - source: "tools/self_improvement_analyzer.py"
    tests: "tests/test_self_improvement.py"
    notes: "Self-improvement analyzer and its tests"

  - source: "tools/pr_driver_decide.py"
    tests: "tests/test_pr_driver.py"
    notes: "Pure PR driver decision function and its unit tests"

  - source: "tools/extract_metrics.py"
    tests: null
    manual_test_required: true
    notes: "Simple metrics extraction script, manual verification needed"

  # Validators - Critical validation tools
  - source: "tools/validators/check_artifacts.py"
    tests: "tests/test_automation.py"
    notes: "Artifact validator tested in automation test suite"

  - source: "tools/validators/check_quality_bar.py"
    tests: "tests/test_automation.py"
    notes: "Quality bar validator tested in automation test suite"

  - source: "tools/validators/check_dependencies.py"
    tests: "tests/test_dependencies.py"
    notes: "Dependency validator and its tests"

  - source: "tools/validators/check_pr_documentation.py"
    tests: null
    manual_test_required: true
    notes: "PR documentation validator, needs integration testing"

  - source: "tools/validators/show_status.py"
    tests: null
    manual_test_required: true
    notes: "Status display utility, no unit tests needed"

  - source: "tools/validators/check_test_collateral.py"
    tests: "tests/test_test_collateral.py"
    notes: "Test collateral validator and its tests"

  - source: "tools/validators/agents_md.py"
    tests: "tests/validators/test_agents_md.py"
    notes: "Agent profile validator with unit tests"

  - source: "tools/validators/check_test_claims.py"
    tests: "tests/test_test_claims_validator.py"
    notes: "Test claims validator to prevent fabricated test results"

  - source: "tools/validators/check_placeholders.py"
    tests: "tests/validators/test_placeholders.py"
    notes: "Placeholder implementation validator and its tests"

  - source: "tools/validators/block_validator.py"
    tests: "tests/validators/test_block_validator.py"
    notes: "Structured block schema and lifecycle validator"

  - source: "tools/validators/check_hygiene.py"
    tests: null
    manual_test_required: true
    notes: "Hygiene checks validator, manual verification needed"

  - source: "tools/validators/test_capability_matrix.py"
    tests: "tests/validators/test_capability_matrix.py"
    notes: "Capability matrix validator with unit tests"

  - source: "tools/validators/check_test_environment.py"
    tests: "tests/validators/test_check_test_environment.py"
    notes: "Test environment validator and its tests"

  - source: "tools/validators/check_merge_queue.py"
    tests: "tests/test_check_merge_queue.py"
    notes: "Merge-queue readiness invariant validator and its tests"

  - source: "tools/validators/check_attestation.py"
    tests: "tests/test_attestation_check.py"
    notes: "Attestation parser and validator checks"

  - source: "tools/validators/check_python_deps.py"
    tests: "tests/test_check_python_deps.py"
    notes: "Python dependency validator and its tests"

  - source: "tools/validators/__main__.py"
    tests: "tests/test_check_python_deps.py"
    notes: "Validator package entry point and registration"

  # GitHub Workflows - Configuration files
  - source: ".github/workflows/agent-gates.yml"
    tests: "tests/test_autonomy_gates.py"
    notes: "Agent gates workflow has specific test coverage"

  - source: ".github/workflows/verify.yml"
    tests: "tests/test_agent_spec_compliance_workflow.py"
    notes: "Verify workflow has specific test coverage"

  - source: ".github/workflows/dashboard-build.yml"
    tests: null
    manual_test_required: true
    notes: "Dashboard CI matrix + security scans (gitleaks, token handling, renderer egress) verified via workflow runs"

  - source: ".github/workflows/*.yml"
    tests: null
    manual_test_required: true
    notes: "Workflow files require manual verification and integration testing"

  # Agent Prompts - Agent configuration
  - source: ".github/agents/*.md"
    tests: "tests/test_agent_prompts.py"
    notes: "All agent prompts validated by test suite"

  # Automation Configuration
  - source: ".github/automation/reviewers.json"
    tests: "tests/test_automation.py"
    notes: "Reviewers config validated by automation tests"

  # Feedback System
  - source: "feedback/**/*.yml"
    tests: "tests/test_feedback.py"
    notes: "Feedback system configuration and files"

  # Project: kerrigan-dashboard
  - source: "specs/projects/kerrigan-dashboard/previs/**"
    tests:
      - "tests/projects/kerrigan_dashboard/test_previs_static.py"
      - "tests/projects/kerrigan_dashboard/test_previs_budgets.py"
      - "tests/projects/kerrigan_dashboard/test_previs_responsive.py"
    notes: "Pre-vis HTML mockup validated by static, budgets, and responsive tests"

  - source: "specs/projects/kerrigan-dashboard/design-references.md"
    tests: "tests/projects/kerrigan_dashboard/test_design_references_updated.py"
    notes: "Design references decisions-locked section validated (AC-7)"

  # Test files themselves
  - source: "tests/test_*.py"
    tests: null
    notes: "Test files don't require additional tests"

# Configuration
config:
  # If true, warn but don't fail when source changes without test updates
  warn_only: false
  
  # Pattern to identify test files (used to track which tests changed)
  test_file_patterns:
    - "tests/test_*.py"
    - "tests/**/test_*.py"
  
  # Ignore these patterns when checking for changes
  exclude_patterns:
    - "*.md"           # Documentation changes
    - "*.txt"          # Text files
    - "*.json"         # Most JSON config files (except specific mappings above)
    - ".gitignore"     # Git configuration
    - "LICENSE"        # License file
    - "CHANGELOG.md"   # Changelog
    - "examples/**/*"  # Example files
    - "docs/**/*"      # Documentation
    - "scripts/**/*"   # Build/deployment scripts
    - ".github/ISSUE_TEMPLATE/**/*"  # Issue templates
    - ".github/PULL_REQUEST_TEMPLATE.md"  # PR template
    - ".github/CODEOWNERS"  # CODEOWNERS file
