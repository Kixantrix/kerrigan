name: verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validators:
    name: kerrigan check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Python version
        id: python-version
        shell: bash
        run: |
          if [[ -f .tool-versions ]]; then
            version=$(awk '$1 == "python" { print $2; exit }' .tool-versions)
          fi
          echo "value=${version:-3.13}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python-version.outputs.value }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi
          pip install pyyaml click
          pip install -e tools/cli/kerrigan

      - name: Run validators
        run: kerrigan check

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Python version
        id: python-version
        shell: bash
        run: |
          if [[ -f .tool-versions ]]; then
            version=$(awk '$1 == "python" { print $2; exit }' .tool-versions)
          fi
          echo "value=${version:-3.13}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python-version.outputs.value }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi
          pip install pyyaml click

      - name: Run smoke test (if present)
        shell: bash
        run: |
          if [[ -f scripts/smoke.sh ]]; then
            bash scripts/smoke.sh
          elif [[ -f scripts/smoke.ps1 ]]; then
            pwsh -File scripts/smoke.ps1
          else
            echo "No smoke script found (scripts/smoke.sh or scripts/smoke.ps1). Skipping."
          fi

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Python version
        id: python-version
        shell: bash
        run: |
          if [[ -f .tool-versions ]]; then
            version=$(awk '$1 == "python" { print $2; exit }' .tool-versions)
          fi
          echo "value=${version:-3.13}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python-version.outputs.value }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi
          pip install pyyaml click

      - name: Run tests (if tests/ exists)
        shell: bash
        run: |
          if [[ -d tests ]]; then
            python -m pytest tests/ -v
          else
            echo "No tests/ directory found. Skipping."
          fi
