name: dashboard-build

on:
  pull_request:
    paths:
      - "apps/kerrigan-dashboard/**"
      - "scripts/smoke.sh"
      - "scripts/smoke.ps1"
      - ".github/workflows/dashboard-build.yml"
  push:
    paths:
      - "apps/kerrigan-dashboard/**"
      - "scripts/smoke.sh"
      - "scripts/smoke.ps1"
      - ".github/workflows/dashboard-build.yml"

permissions:
  contents: read

jobs:
  security-scans:
    name: security-scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check gh auth token handling
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import pathlib
          import re
          import sys

          repo = pathlib.Path(".")
          roots = [
              repo / "apps" / "kerrigan-dashboard",
              repo / "scripts",
              repo / "tools",
              repo / ".github" / "workflows",
          ]

          allowed_pipe_targets = {"gh", "git", "copilot"}
          text_extensions = {".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".py", ".rs", ".sh", ".ps1", ".yml", ".yaml"}
          ignore_files = {
              repo / ".github" / "workflows" / "dashboard-build.yml",
          }

          token_re = re.compile(r"gh\s+auth\s+token")
          redirection_re = re.compile(r"gh\s+auth\s+token\s*(?:\d?>|>>|2>>|&>)")
          logging_re = re.compile(r"(echo|printf|Write-Output|Write-Host).*?(?:\$\(\s*gh\s+auth\s+token\s*\)|`gh auth token`)")

          issues: list[str] = []

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path in ignore_files or not path.is_file() or path.suffix not in text_extensions:
                      continue
                  try:
                      lines = path.read_text(encoding="utf-8").splitlines()
                  except UnicodeDecodeError:
                      continue

                  for idx, line in enumerate(lines, start=1):
                      if not token_re.search(line):
                          continue

                      stripped = line.strip()
                      if stripped.startswith("#") or stripped.startswith("//") or stripped.startswith("*"):
                          continue

                      if redirection_re.search(line):
                          issues.append(f"{path}:{idx}: gh auth token output redirected to file/stream")
                          continue

                      if logging_re.search(line):
                          issues.append(f"{path}:{idx}: gh auth token output logged")
                          continue

                      if "|" in line:
                          pipe_target = line.split("|", 1)[1].strip().split()
                          cmd = pipe_target[0] if pipe_target else ""
                          if cmd and cmd not in allowed_pipe_targets:
                              issues.append(
                                  f"{path}:{idx}: gh auth token piped to non-allowlisted process '{cmd}'"
                              )

          if issues:
              print("Forbidden gh auth token handling detected:")
              for issue in issues:
                  print(f"  - {issue}")
              sys.exit(1)

          print("No forbidden gh auth token handling patterns detected.")
          PY

      - name: Renderer egress guard (CSP/http.scope)
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import pathlib
          import re
          import sys

          cfg_path = pathlib.Path("apps/kerrigan-dashboard/src-tauri/tauri.conf.json")
          cfg = json.loads(cfg_path.read_text(encoding="utf-8"))

          allowed = {"https://api.github.com", "https://*.githubusercontent.com"}
          forbidden_tokens = {"*"}

          app_cfg = cfg.get("app", {})
          security = app_cfg.get("security", {})
          csp = security.get("csp")

          plugins = cfg.get("plugins", {})
          scope_present = False
          http_scope = None
          if isinstance(plugins, dict):
              http_plugin = plugins.get("http")
              if isinstance(http_plugin, dict):
                  scope_present = "scope" in http_plugin
                  scope = http_plugin.get("scope")
                  if isinstance(scope, list):
                      normalized_scope = []
                      for value in scope:
                          entry = str(value).strip()
                          if entry:
                              normalized_scope.append(entry)
                      http_scope = normalized_scope

          csp_present = isinstance(csp, str) and bool(csp.strip())
          if not csp_present and not scope_present:
              print("Renderer egress guard failed: neither app.security.csp nor plugins.http.scope is configured.")
              print("A strict GitHub-only egress policy (connect-src or plugins.http.scope) is required.")
              sys.exit(1)

          def check_strict_allowlist(values: list[str], source: str) -> list[str]:
              issues: list[str] = []
              entries = set(values)
              missing = sorted(allowed - entries)
              extras = sorted(entries - allowed)
              forbidden = sorted(v for v in entries if v in forbidden_tokens or re.match(r"^[A-Za-z][A-Za-z0-9+.-]*:$", v))
              if missing:
                  issues.append(f"{source}: missing required GitHub origins: {missing}")
              if extras:
                  issues.append(f"{source}: contains non-allowlisted origins: {extras}")
              if forbidden:
                  issues.append(f"{source}: contains forbidden wildcard/scheme sources: {forbidden}")
              return issues

          issues: list[str] = []

          if csp_present:
              connect_src = None
              for directive in [d.strip() for d in csp.split(";") if d.strip()]:
                  if directive.startswith("connect-src"):
                      connect_src = directive
                      break
              if not connect_src:
                  issues.append("CSP: missing connect-src directive")
              else:
                  csp_tokens = connect_src.split()[1:]
                  issues.extend(check_strict_allowlist(csp_tokens, "CSP connect-src"))

          if scope_present:
              if http_scope is None:
                  issues.append("plugins.http.scope: must be an array when configured")
              else:
                  issues.extend(check_strict_allowlist(http_scope, "plugins.http.scope"))

          if issues:
              print("Renderer egress guard failed.")
              for issue in issues:
                  print(f"  - {issue}")
              print(f"Found CSP: {csp!r}")
              print(f"Found plugins.http.scope: {http_scope!r}")
              sys.exit(1)

          print("Renderer egress guard passed: strict GitHub-only egress policy is configured.")
          PY

  build:
    name: build (${{ matrix.os }})
    needs: security-scans
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.12.2 --activate
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: apps/kerrigan-dashboard/src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libglib2.0-dev

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Lint dashboard
        shell: bash
        run: pnpm -C apps/kerrigan-dashboard lint

      - name: Test dashboard
        shell: bash
        run: pnpm -C apps/kerrigan-dashboard test

      - name: Build dashboard
        shell: bash
        run: pnpm -C apps/kerrigan-dashboard tauri build

      - name: Run extended smoke (Unix)
        if: runner.os != 'Windows'
        env:
          KERRIGAN_SMOKE_DASHBOARD: "1"
          KERRIGAN_SMOKE_DASHBOARD_SKIP_BUILD: "1"
        shell: bash
        run: bash scripts/smoke.sh

      - name: Run extended smoke (Windows)
        if: runner.os == 'Windows'
        env:
          KERRIGAN_SMOKE_DASHBOARD: "1"
          KERRIGAN_SMOKE_DASHBOARD_SKIP_BUILD: "1"
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Upload Windows bundles
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dashboard-windows-bundle
          if-no-files-found: error
          path: |
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/msi/*.msi
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dashboard-macos-bundle
          if-no-files-found: error
          path: |
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/dmg/*.dmg
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/macos/*.app

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dashboard-linux-bundle
          if-no-files-found: error
          path: |
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/deb/*.deb
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/rpm/*.rpm
