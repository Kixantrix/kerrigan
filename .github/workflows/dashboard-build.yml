name: dashboard-build

on:
  pull_request:
    paths:
      - "apps/kerrigan-dashboard/**"
      - "scripts/smoke.sh"
      - "scripts/smoke.ps1"
      - ".github/workflows/dashboard-build.yml"
  push:
    paths:
      - "apps/kerrigan-dashboard/**"
      - "scripts/smoke.sh"
      - "scripts/smoke.ps1"
      - ".github/workflows/dashboard-build.yml"

permissions:
  contents: read

jobs:
  security-scans:
    name: security-scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check gh auth token handling
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import pathlib
          import re
          import sys

          repo = pathlib.Path(".")
          roots = [
              repo / "apps" / "kerrigan-dashboard",
              repo / "scripts",
              repo / "tools",
              repo / ".github" / "workflows",
          ]

          allowed_pipe_targets = {"gh", "git", "copilot"}
          text_extensions = {".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".py", ".rs", ".sh", ".ps1", ".yml", ".yaml"}
          ignore_files = {
              repo / ".github" / "workflows" / "dashboard-build.yml",
          }

          token_re = re.compile(r"gh\s+auth\s+token")
          redirection_re = re.compile(r"gh\s+auth\s+token\s*(?:\d?>|>>|2>>|&>)")
          logging_re = re.compile(r"(echo|printf|Write-Output|Write-Host).*?(?:\$\(\s*gh\s+auth\s+token\s*\)|`gh auth token`)")

          issues: list[str] = []

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path in ignore_files or not path.is_file() or path.suffix not in text_extensions:
                      continue
                  try:
                      lines = path.read_text(encoding="utf-8").splitlines()
                  except UnicodeDecodeError:
                      continue

                  for idx, line in enumerate(lines, start=1):
                      if not token_re.search(line):
                          continue

                      stripped = line.strip()
                      if stripped.startswith("#") or stripped.startswith("//") or stripped.startswith("*"):
                          continue

                      if redirection_re.search(line):
                          issues.append(f"{path}:{idx}: gh auth token output redirected to file/stream")
                          continue

                      if logging_re.search(line):
                          issues.append(f"{path}:{idx}: gh auth token output logged")
                          continue

                      if "|" in line:
                          pipe_target = line.split("|", 1)[1].strip().split()
                          cmd = pipe_target[0] if pipe_target else ""
                          if cmd and cmd not in allowed_pipe_targets:
                              issues.append(
                                  f"{path}:{idx}: gh auth token piped to non-allowlisted process '{cmd}'"
                              )

          if issues:
              print("Forbidden gh auth token handling detected:")
              for issue in issues:
                  print(f"  - {issue}")
              sys.exit(1)

          print("No forbidden gh auth token handling patterns detected.")
          PY

      - name: Renderer egress guard (CSP/http.scope)
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import pathlib
          import re
          import sys

          cfg_path = pathlib.Path("apps/kerrigan-dashboard/src-tauri/tauri.conf.json")
          cfg = json.loads(cfg_path.read_text(encoding="utf-8"))

          allowed = {"https://api.github.com", "https://*.githubusercontent.com"}
          probe_origin = "https://example.com"

          app_cfg = cfg.get("app", {})
          security = app_cfg.get("security", {})
          csp = security.get("csp")

          csp_ok = False
          if isinstance(csp, str):
              connect_src = None
              for directive in [d.strip() for d in csp.split(";") if d.strip()]:
                  if directive.startswith("connect-src"):
                      connect_src = directive
                      break
              if connect_src:
                  tokens = connect_src.split()[1:]
                  required = allowed.issubset(set(tokens))
                  wildcard_blocked = "*" not in tokens and probe_origin not in tokens
                  csp_ok = required and wildcard_blocked

          plugins = cfg.get("plugins", {})
          http_scope = []
          if isinstance(plugins, dict):
              http_plugin = plugins.get("http")
              if isinstance(http_plugin, dict):
                  scope = http_plugin.get("scope")
                  if isinstance(scope, list):
                      http_scope = [str(v) for v in scope]

          scope_ok = bool(http_scope) and allowed.issubset(set(http_scope)) and probe_origin not in set(http_scope)

          if not (csp_ok or scope_ok):
              print("Renderer egress guard failed.")
              print("Expected CSP connect-src or plugins.http.scope to allow only GitHub origins and block non-allowlisted origins.")
              print(f"Found CSP: {csp!r}")
              print(f"Found plugins.http.scope: {http_scope!r}")
              sys.exit(1)

          print("Renderer egress guard passed: non-allowlisted origin would be blocked.")
          PY

  build:
    name: build (${{ matrix.os }})
    needs: security-scans
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.12.2 --activate
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/kerrigan-dashboard/src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libglib2.0-dev

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Lint dashboard
        shell: bash
        run: pnpm -C apps/kerrigan-dashboard lint

      - name: Test dashboard
        shell: bash
        run: pnpm -C apps/kerrigan-dashboard test

      - name: Build dashboard
        shell: bash
        run: pnpm -C apps/kerrigan-dashboard tauri build

      - name: Run extended smoke (Unix)
        if: runner.os != 'Windows'
        env:
          KERRIGAN_SMOKE_DASHBOARD: "1"
          KERRIGAN_SMOKE_DASHBOARD_SKIP_BUILD: "1"
        shell: bash
        run: bash scripts/smoke.sh

      - name: Run extended smoke (Windows)
        if: runner.os == 'Windows'
        env:
          KERRIGAN_SMOKE_DASHBOARD: "1"
          KERRIGAN_SMOKE_DASHBOARD_SKIP_BUILD: "1"
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Upload Windows bundles
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-windows-bundle
          if-no-files-found: error
          path: |
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/msi/*.msi
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-macos-bundle
          if-no-files-found: error
          path: |
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/dmg/*.dmg
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/macos/*.app

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-linux-bundle
          if-no-files-found: error
          path: |
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/deb/*.deb
            apps/kerrigan-dashboard/src-tauri/target/release/bundle/rpm/*.rpm
