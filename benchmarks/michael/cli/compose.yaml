services:
  default:
    image: python:3.12-slim@sha256:191083cdf6c7bda8c76158983163ead5d5cf7b77cf3033e805bb0f5296f51b4b
    command: sleep infinity
    working_dir: /work
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    volumes: [work:/work]
    labels:
      michael-cli: ${MB_CLI_ID:?owned run ID required}
      michael-role: agent
volumes:
  work:
    labels:
      michael-cli: ${MB_CLI_ID:?owned run ID required}
