title: "Green tests pass while design fidelity fails — verification chain is blind to stub geometry and clipped layout"

description: |
  The three asset-design playbook test dispatches (#419 voxel → PR #422, #420 guitar
  → PR #423, #421 cards → PR #424) all passed their full CI chain (kerrigan check,
  tests, smoke, check-attestation) and merged. But two of the three shipped design
  defects that no automated check caught:

  - Guitar (#423): the headstock exported as an 8-vertex rounded rectangle (80x190mm)
    with a single nut line — no tuner holes, no slots, no real silhouette. The "brass
    logo" was two nested rectangles plus a "BRASS 0.5mm" text label, with no actual
    logo artwork. All 5 pytest ACs passed because they assert units, bbox-fits-stock,
    manufacturability, and determinism — never design substance.

  - Cards (#424): the rules text ("ENTERS") was clipped off the right edge because the
    compositor had no word-wrap and no AC asserted that text fits inside the text box.
    All 6 smoke ACs passed.

  - Voxel (#422) was the one good result: a recognizable colored ship, 716 tris,
    manifold, deterministic, PoT texture.

  Impact: the verification chain proves correctness (dimensions, manifold, units,
  determinism, manufacturability envelope) but is blind to whether an asset is actually
  well-designed. An agent can satisfy every check with a stub and ship a green PR. For
  asset work, "all tests green" gave false confidence in design quality.

