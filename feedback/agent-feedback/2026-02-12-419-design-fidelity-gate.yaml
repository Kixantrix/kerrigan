context: |
  Discovered while driving PRs #422/#423/#424 through the merge chain and rendering each
  PR's artifacts to images for a human quality review. The defects were obvious on sight
  but invisible to the test suite. Root cause: acceptance criteria tested the bounding
  envelope, not design substance — a placeholder passes every one of them.

  All three PRs are now merged (the guitar shipped with placeholder geometry by explicit
  human decision, as a test artifact). The process gap is addressed via the playbook fix
  below rather than by re-dispatching the guitar track.

  Secondary finding: all three tracks appended deps to a shared requirements.txt, causing
  a merge conflict on #423 after #422 merged first. The conflict-predictor would have
  flagged requirements.txt as a shared-file conflict and wave-gated the dispatch; the
  tracks were treated as "disjoint dirs" but the shared dependency file was missed.

proposed_solution: |
  Implemented in this PR — added a "Design-fidelity gate" to playbooks/asset-design.md:

  1. Fidelity assertions, not just envelope assertions: every AC must test design
     substance. Rule of thumb — "write the assertion a placeholder would fail."
     Per-track specifics: cards assert text fits + layers non-blank; guitar asserts
     load-bearing features (N tuner holes at spec'd positions, nut slot, non-trivial
     outline) + real logo path geometry; voxel asserts silhouette differs from its box.

  2. Golden-render regression: commit one approved reference render per asset under
     previs/golden/; smoke test re-renders from source and diffs against it. Forces a
     real render to exist and catches silent drift.

  3. Mandatory render-and-eyeball before merge: no asset PR merges without its artifacts
     rendered and attached to the PR. A green asset PR with no visible artifact is not
     reviewable.

  Follow-up to consider separately: have the conflict-predictor treat shared manifest
  files (requirements.txt, package.json, Cargo.toml) as conflict surfaces even when
  tasks touch otherwise-disjoint directories.

