proposed_solution: |
  Make DFMA the default lens for physical-product work. It is implemented in this change:
  - dfma skill: builder profile, sourcing ladder, precision-in-the-part, simplicity tests,
    part completeness (source, retention, connection, step, tool), and hand-work-framed decisions.
  - assembly-ledger.yaml plus check_assembly_ledger.py: every hand operation is checked against
    the builder profile, and --strict is the ready-to-order gate.
  - hardware-product playbook: phases and gates, a fast check loop, the viewer as review surface,
    a supplier-facts log, and the CAD model treated as a serial resource.

